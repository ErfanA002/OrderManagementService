services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: student-management-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Sa123456"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    restart: unless-stopped
volumes:
  mssql_data:
  redis_data: